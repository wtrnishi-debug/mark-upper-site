<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Upper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=4">
</head>
<body>

  <nav id="mu-nav">
    <div id="mu-nav-left">
      <span class="mu-logo">Mark Upper</span>
      <input type="url" id="mu-url-input" placeholder="https://example.com" autocomplete="off" spellcheck="false">
      <button class="mu-btn-primary" id="mu-open-btn">開く</button>
    </div>
    <div id="mu-nav-right">
      <button class="mu-pill-btn mu-icon-btn" id="mu-user-btn" title="名前を設定">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M2 12c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="mu-pill-btn mu-icon-btn" id="mu-share-btn" title="URLをコピーして共有">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="11" cy="2.5" r="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="11" cy="11.5" r="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="3" cy="7" r="1.5" stroke="currentColor" stroke-width="1.3"/><line x1="4.3" y1="6.2" x2="9.7" y2="3.3" stroke="currentColor" stroke-width="1.3"/><line x1="4.3" y1="7.8" x2="9.7" y2="10.7" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="mu-pill-btn mu-icon-btn" id="mu-theme-btn" title="テーマを切り替え">
        <svg class="mu-icon-moon" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12 8.5A5.5 5.5 0 015.5 2a5.5 5.5 0 100 10A5.5 5.5 0 0012 8.5z" stroke="currentColor" stroke-width="1.4"/></svg>
        <svg class="mu-icon-sun"  width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="2.5" stroke="currentColor" stroke-width="1.4"/><line x1="7" y1="1" x2="7" y2="2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="7" y1="11.5" x2="7" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="1" y1="7" x2="2.5" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="11.5" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2.93" y1="2.93" x2="4" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="10" x2="11.07" y2="11.07" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="11.07" y1="2.93" x2="10" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="4" y1="10" x2="2.93" y2="11.07" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </nav>

  <div id="mu-main">

    <!-- LEFT SIDEBAR -->
    <aside id="mu-sidebar">

      <!-- ステータスサマリー -->
      <div class="mu-sidebar-hdr">
        <span class="mu-sidebar-title" id="mu-sidebar-domain">コメント</span>
        <span class="mu-count-badge" id="mu-count-badge">0</span>
      </div>

      <div id="mu-status-bar" class="mu-status-bar" style="display:none">
        <div class="mu-st-row"><span class="mu-st-dot st-open"></span><span class="mu-st-key">未対応</span><span class="mu-st-val" id="st-open">0</span></div>
        <div class="mu-st-row"><span class="mu-st-dot st-fixed"></span><span class="mu-st-key">対応済</span><span class="mu-st-val" id="st-fixed">0</span></div>
        <div class="mu-st-row"><span class="mu-st-dot st-verified"></span><span class="mu-st-key">確認完了</span><span class="mu-st-val" id="st-verified">0</span></div>
        <div class="mu-st-row"><span class="mu-st-dot st-rejected"></span><span class="mu-st-key">差し戻し</span><span class="mu-st-val" id="st-rejected">0</span></div>
      </div>

      <!-- ページ一覧 -->
      <div id="mu-page-nav" class="mu-page-nav"></div>

      <!-- ブックマークレット -->
      <div id="mu-bm-section" class="mu-bm-section" style="display:none">
        <div class="mu-bm-label">ブックマークレット</div>
        <a id="mu-bm-link" class="mu-bm-btn" href="#" title="ブックマークバーにドラッグして登録">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M9.5 1.5L12.5 4.5L5 12H2V9L9.5 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          Mark Upper
        </a>
        <p class="mu-bm-hint">↑ ブックマークバーにドラッグして登録<br>登録後、レビューしたいページで押すとコメントできます</p>
      </div>

    </aside>

    <!-- MAIN: コメント一覧 -->
    <main id="mu-content">
      <div id="mu-empty" class="mu-empty-state">
        <div class="mu-empty-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect x="4" y="8" width="32" height="24" rx="3" stroke="currentColor" stroke-width="2" opacity=".35"/><line x1="4" y1="15" x2="36" y2="15" stroke="currentColor" stroke-width="2" opacity=".35"/><circle cx="8.5" cy="11.5" r="1.5" fill="currentColor" opacity=".35"/><circle cx="13.5" cy="11.5" r="1.5" fill="currentColor" opacity=".35"/></svg>
        </div>
        <p class="mu-empty-title">URLを入力してプロジェクトを開く</p>
        <p class="mu-empty-sub">開いたら表示されるブックマークレットを登録して<br>レビューしたいページでクリックするとコメントを追加できます</p>
      </div>
      <div id="mu-comment-list" style="display:none"></div>
    </main>

  </div>

  <div id="mu-toast" class="mu-toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=1"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
